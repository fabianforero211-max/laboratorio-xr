<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laboratorio XR - Final</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  </head>
  <body>
    <!-- BOTÓN DE EMERGENCIA PARA FORZAR VR -->
    <button id="forceVR" style="position: fixed; top: 20px; left: 20px; z-index: 9999; padding: 15px; background: #ff0000; color: white; border: none; border-radius: 5px; font-weight: bold;">
      ENTRAR EN MODO VR (FOTO AQUÍ)
    </button>

    <a-scene vr-mode-ui="enabled: true">
      <a-assets>
        <a-asset-item id="cinta" src="Cintatransportadora.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#808080"></a-plane>

      <a-entity gltf-model="#cinta" position="0 0 -5" scale="1 1 1"></a-entity>
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="-1 2 1"></a-entity>
    </a-scene>

    <script>
      // Este pequeño código obliga a la página a entrar en VR al tocar el botón rojo
      document.getElementById('forceVR').addEventListener('click', function () {
        document.querySelector('a-scene').enterVR();
      });
    </script>
  </body>
</html>
